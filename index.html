<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triple Hunter</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0d1117;color:#fff;
 font-family:Arial,sans-serif;padding:20px
}
.container{max-width:650px;margin:auto}
header{text-align:center;padding:25px 0}
h1{color:#58a6ff;font-size:32px}
p{color:#9ca3af}
.panel{
 background:#161b22;border:1px solid #30363d;
 padding:18px;border-radius:14px;margin:15px 0
}
button,input,select{
 padding:12px;border-radius:9px;border:1px solid #444;
 background:#21262d;color:white;font-size:15px
}
button{cursor:pointer}
.primary{background:#238636;width:100%;margin-top:12px}
.results{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{
 background:#21262d;border:1px solid #30363d;
 border-radius:10px;padding:12px;text-align:center
}
.username{font-size:23px;font-weight:bold;color:#58a6ff}
.actions{display:flex;gap:6px;margin-top:10px}
.actions button{flex:1;font-size:12px}
.stats{display:flex;justify-content:space-around;text-align:center}
.stats strong{display:block;color:#58a6ff;font-size:22px}
input{width:100%;margin:7px 0}
</style>
</head>
<body>
<div class="container">

<header>
<h1>TRIPLE HUNTER</h1>
<p>Instagram Username Assistant</p>
</header>

<div class="panel">
<h3>إعدادات التوليد</h3>

<label>نوع التركيبات</label>
<select id="type">
<option value="all">جميع التركيبات الثلاثية</option>
<option value="letters">أحرف فقط</option>
<option value="numbers">أرقام فقط</option>
<option value="mixed">أحرف وأرقام</option>
</select>

<label>عدد النتائج المعروضة</label>
<select id="limit">
<option value="100">100</option>
<option value="500">500</option>
<option value="1000">1000</option>
<option value="5000">5000</option>
<option value="46656">الكل</option>
</select>

<button class="primary" onclick="generate()">
توليد اليوزرات
</button>
</div>

<div class="panel stats">
<div><strong id="total">0</strong>النتائج</div>
<div><strong>46,656</strong>إجمالي التركيبات</div>
</div>

<div class="panel">
<input id="search" placeholder="ابحث عن يوزر..." oninput="render()">
<button onclick="copyAll()">نسخ النتائج المعروضة</button>
</div>

<div id="results" class="results"></div>

<p style="text-align:center">
الفحص النهائي للتوفر يتم يدوياً عبر إنستغرام.
</p>
</div>

<script>
const chars="abcdefghijklmnopqrstuvwxyz0123456789";
let usernames=[];
let shown=[];

function generate(){
 usernames=[];

 const type=document.getElementById("type").value;
 const limit=Number(document.getElementById("limit").value);

 for(let a of chars){
 for(let b of chars){
 for(let c of chars){

 const name=a+b+c;
 const letters=/^[a-z]+$/.test(name);
 const numbers=/^[0-9]+$/.test(name);

 if(type==="letters"&&!letters)continue;
 if(type==="numbers"&&!numbers)continue;
 if(type==="mixed"&&(letters||numbers))continue;

 usernames.push(name);
 }
 }
 }

 usernames=usernames.slice(0,limit);
 render();
}

function render(){
 const query=document.getElementById("search").value.toLowerCase();
 shown=usernames.filter(u=>u.includes(query));
 document.getElementById("total").textContent=shown.length;

 const area=document.getElementById("results");
 area.innerHTML="";

 shown.slice(0,200).forEach(name=>{
 const card=document.createElement("div");
 card.className="item";

 const title=document.createElement("div");
 title.className="username";
 title.textContent=name;

 const actions=document.createElement("div");
 actions.className="actions";

 const copy=document.createElement("button");
 copy.textContent="نسخ";
 copy.onclick=()=>navigator.clipboard.writeText(name);

 const open=document.createElement("button");
 open.textContent="فتح إنستغرام";
 open.onclick=()=>window.open(
 "https://www.instagram.com/"+name+"/","_blank"
 );

 actions.append(copy,open);
 card.append(title,actions);
 area.append(card);
 });
}

function copyAll(){
 navigator.clipboard.writeText(shown.join("\n"));
}

generate();
</script>
</body>
</html>
